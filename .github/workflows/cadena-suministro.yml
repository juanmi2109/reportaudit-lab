# Pipeline de la cadena de suministro segura de ReportAudit.
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
name: Cadena de suministro segura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube-cloud:
    name: SAST - SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias y herramienta de cobertura
        run: |
          python -m pip install -r requirements.txt
          python -m pip install coverage==7.6.12

      - name: Ejecutar pruebas y generar cobertura
        run: |
          python -m coverage run --branch --include="app/*" -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar CodeQL para Python
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - name: Ejecutar el análisis y publicar los resultados
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"


  sca-pip-audit:
    name: SCA - pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6
      - name: Preparar Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Auditar las dependencias con pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt
          no-deps: true
          disable-pip: true

  secretos-gitleaks:
    name: Secretos - Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Descargar el código con todo su historial
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Buscar secretos en los commits
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"